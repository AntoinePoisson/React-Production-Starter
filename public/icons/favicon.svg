<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="React App Fondation">
  <!-- The one vector source. `pnpm assets:brand` reads the .fg path out of this file to build
       every raster icon and the OG image, so keep the class and the square viewBox.
       Colours mirror the color-accent / color-ink theme variables in app/globals.css.
       Keep this comment free of double hyphens. A favicon is parsed as strict XML, where a
       double hyphen inside a comment is a fatal error, and the icon then fails to load at
       all: no console message, just no icon in the tab. -->
  <style>
    .bg { fill: #0f172a }
    .fg { fill: #6b8cfa }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #f1f5f9 }
      .fg { fill: #8fa8ff }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7" />
  <path class="fg" d="M16 7.5 24.5 22h-17L16 7.5Z" />
</svg>

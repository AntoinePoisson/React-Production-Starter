# https://lefthook.dev/configuration/
#
# Commands call ./node_modules/.bin directly rather than going through `pnpm run` / `pnpm exec`.
# A hook is not an interactive shell: when the pnpm on PATH differs from the pinned
# `packageManager`, it re-execs itself, and that extra hop has hung commits here. It also saves
# two node processes per command on a machine already running the linter in parallel.
#
# Everything that can block is wrapped in scripts/with-timeout.sh, so a stuck command fails the
# commit instead of freezing it.

pre-commit:
  parallel: true

  commands:
    # Strict on the shared branches, permissive elsewhere. A feature branch is where a scratch
    # console.log may live, it just has to be gone before the code reaches develop.
    # stage_fixed re-stages only what the hooks touched, never `git add -A`.
    linter:
      glob: '*'
      stage_fixed: true
      run: |
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        case "$BRANCH" in
          main|master|prod|dev|devel|develop) MAX_WARNINGS="--max-warnings 0" ;;
          *) echo "Running permissive linter on branch: $BRANCH"; MAX_WARNINGS="" ;;
        esac
        sh scripts/with-timeout.sh 300 ./node_modules/.bin/prettier . --check --write \
          && sh scripts/with-timeout.sh 300 ./node_modules/.bin/eslint --fix $MAX_WARNINGS .

    # Staged files only, a full tsc here would be too slow for a hook.
    typecheck:
      glob: '*.{ts,tsx}'
      run: |
        echo "Running TypeScript type checking on staged files..."
        sh scripts/with-timeout.sh 180 ./node_modules/.bin/tsc-files --noEmit {staged_files}

    # Re-extracts the catalogues so a new <Trans> can't reach a branch without its entry.
    # --clean drops what a rename left behind.
    #
    # It reports instead of staging, on purpose: `lingui extract` reads src/ from disk, not from
    # the index. Stage one file while another in the working tree carries a new (or deleted)
    # <Trans> and a `git add` here would commit entries for code that isn't in the commit. The
    # files are already rewritten on disk when this fails, review them and stage them yourself.
    i18n:
      glob: '*.{ts,tsx}'
      run: |
        sh scripts/with-timeout.sh 120 ./node_modules/.bin/lingui extract --clean || {
          echo ""
          echo "❌ lingui extract failed or timed out."
          echo "   Run it by hand to see why: ./node_modules/.bin/lingui extract --clean"
          exit 1
        }
        if ! git diff --quiet -- src/i18n/messages; then
          echo ""
          echo "❌ Translation catalogues do not match what is staged."
          echo "   src/i18n/messages/*.json has just been re-extracted from the working tree."
          echo "   Review the diff, fill in any empty translation, 'git add' it, and commit again."
          exit 1
        fi
        echo "✅ Translation catalogues up to date"

    # `pnpm audit`, not `pnpm run audit`: the built-in is what we want, and the script only wraps
    # it. Timed out because it talks to the registry.
    audit:
      run: |
        echo "Running security audit..."
        sh scripts/with-timeout.sh 120 pnpm audit --prod --audit-level=moderate

    knip:
      run: |
        echo "Running Knip to check for unused code..."
        sh scripts/with-timeout.sh 180 ./node_modules/.bin/knip

    size-limit:
      run: |
        if [ -d "dist" ]; then
          echo "Checking bundle sizes with size-limit..."
          sh scripts/with-timeout.sh 180 ./node_modules/.bin/size-limit
        else
          echo "⏭️  Skipping size-limit check (no dist/ folder found)"
        fi

    secrets-check:
      run: node scripts/check-secrets.mjs

    # Source files only, and added lines only. Otherwise *removing* a TODO fails the commit, and
    # editing a doc that legitimately contains the word becomes impossible.
    #
    # grep -Ev, not grep -v: the pattern escapes its `+`, which BSD grep and ugrep both reject in
    # a basic regex. That error went to stderr and the empty pipe read as "nothing found", so the
    # check passed on every commit without inspecting a line.
    fixme-check:
      run: |
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        case "$BRANCH" in
          main|master|prod)
            echo "🔍 Checking for FIXME/TODO comments on branch: $BRANCH"

            if git diff --cached -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.css' \
              | grep -E '^\+' | grep -Ev '^\+\+\+' | grep -E "(FIXME|TODO|XXX|HACK)" --color=always; then
              echo ""
              echo "❌ Found FIXME/TODO/XXX/HACK in added source lines - not allowed on $BRANCH"
              echo "Please resolve these before committing to a production branch."
              exit 1
            fi

            echo "✅ No FIXME/TODO comments found"
            ;;
          *)
            echo "⏭️  Skipping FIXME check (not on main/master/prod branch)"
            ;;
        esac

    # Fails the commit if new .original files were created, they need a manual look.
    optimize-assets:
      run: |
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        case "$BRANCH" in
          dev|devel|develop)
            echo "Optimizing staged assets on branch: $BRANCH"
            sh scripts/with-timeout.sh 300 node scripts/optimize-staged-assets.mjs
            ;;
          *)
            echo "⏭️  Skipping asset optimization (not on a development branch)"
            ;;
        esac

# Long-running, production branches only.
pre-push:
  parallel: true

  commands:
    tests:
      run: |
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        case "$BRANCH" in
          main|master|prod)
            echo "🧪 Running full test suite on branch: $BRANCH"
            sh scripts/with-timeout.sh 900 ./node_modules/.bin/lingui compile \
              && sh scripts/with-timeout.sh 900 ./node_modules/.bin/vitest run --coverage
            ;;
          *)
            echo "⏭️  Skipping tests (not on main/master/prod branch)"
            ;;
        esac

    build:
      run: |
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        case "$BRANCH" in
          main|master|prod)
            echo "🏗️  Running production build on branch: $BRANCH"
            echo "⚠️  This may take several minutes..."
            sh scripts/with-timeout.sh 900 ./node_modules/.bin/lingui extract --clean \
              && sh scripts/with-timeout.sh 900 ./node_modules/.bin/lingui compile --strict \
              && sh scripts/with-timeout.sh 900 ./node_modules/.bin/vite build \
              && sh scripts/with-timeout.sh 900 node scripts/postbuild.mjs
            ;;
          *)
            echo "⏭️  Skipping build (not on main/master/prod branch)"
            ;;
        esac

commit-msg:
  commands:
    commitlint:
      run: ./node_modules/.bin/commitlint --edit {1}

name: CI/CD Pipeline

on: [push, pull_request]

# Read-only by default, jobs that need more widen it themselves.
permissions:
  contents: read

# A PR and the push that triggered it land in separate groups on purpose. Collapsing them lets
# the PR run cancel the push run, which is the one that deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # --- LINT ---
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # No version: here, the action reads packageManager from package.json.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      # Unconditional, unlike the install above. The compiled catalogues are gitignored and only
      # the `prepare` script writes them, which never runs on a cache hit. Without this the first
      # warm cache fails with "Cannot find module './messages/en'".
      - run: pnpm exec lingui compile
      # Same idea for the route tree. import-x/no-unresolved reads ./routeTree.gen off disk, so
      # without this the lint fails on src/router.tsx alone.
      - run: pnpm run generate-routes
      - name: Run linter
        run: |
          case "${{ github.ref_name }}" in
            main|master|dev|devel|develop|prod) pnpm run lint ;;
            *) echo "Permissive lint on ${{ github.ref_name }}"; pnpm run lint:permissive ;;
          esac

  # --- TYPECHECK ---
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm exec lingui compile
      # The route tree is generated on dev and build, and gitignored, but tsc needs the file
      # to exist and this job runs neither.
      - run: pnpm run generate-routes
      - run: pnpm run typecheck

  # --- SECURITY AUDIT ---
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm run audit

  # --- SECRETS DETECTION ---
  secrets-check:
    name: Secrets Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # `--all`, not the default staged mode: after checkout the index equals HEAD, so the
      # staged diff is empty and the job would pass without inspecting a byte.
      - run: node scripts/check-secrets.mjs --all

  # --- UNIT TESTS ---
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      # `pnpm run test` compiles the catalogues itself, but nothing here writes the route tree,
      # and Vite has to resolve ./routeTree.gen to transform src/router.tsx at all. Mocking it
      # in tests/router.test.ts is not enough, the failure happens before the mock applies.
      - run: pnpm run generate-routes
      - run: pnpm run test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # --- BUILD ---
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
        env:
          # Required: a static build bakes this in, so without it every page ships a localhost
          # canonical. Settings > Secrets and variables > Actions.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_PROJECT_NAME: ${{ vars.VITE_PROJECT_NAME }}
          VITE_MAIN_WEBSITE_NAME: ${{ vars.VITE_MAIN_WEBSITE_NAME }}
      # dist/client only, dist/server is the render pass and is never deployed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-directory
          path: dist/client/
          retention-days: 7

  # --- SIZE LIMIT ---
  size-limit:
    name: Bundle Size Check
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-directory
          path: dist/client/
      - run: pnpm run size

  # --- STORYBOOK - catches a story that no longer compiles ---
  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm exec lingui compile
      - run: pnpm run build:storybook

  # --- NODE COMPATIBILITY - non-blocking ---
  node-compat:
    name: Compatibility Latest Nodejs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

  # --- E2E DESKTOP - 3 browsers x 4 shards ---
  e2e-test:
    name: E2E (${{ matrix.browser }} - shard ${{ matrix.shard }})
    if: |
      (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'devel' || github.ref_name == 'develop' || github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'prod')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'devel' || github.base_ref == 'develop' || github.base_ref == 'main' || github.base_ref == 'master' || github.base_ref == 'prod'))
    needs: [lint, typecheck, security-audit, secrets-check, test-unit, build]
    runs-on: ubuntu-latest
    # Above playwright.config.ts's own 30-minute globalTimeout, so an overrun is ended by
    # Playwright, which writes a report naming the slow tests.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ matrix.browser }}
          restore-keys: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-directory
          path: dist/client/
      - run: pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: reports/artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # --- E2E MOBILE ---
  # Kept out of the sharded desktop matrix: a Pixel 5 and an iPhone 14 run at a device pixel
  # ratio of 2, roughly 8 Mpx a frame in software against ~2 for chromium.
  e2e-mobile:
    name: E2E (${{ matrix.project }})
    if: |
      (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'devel' || github.ref_name == 'develop' || github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'prod')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'devel' || github.base_ref == 'develop' || github.base_ref == 'main' || github.base_ref == 'master' || github.base_ref == 'prod'))
    needs: [lint, typecheck, security-audit, secrets-check, test-unit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: mobile-chrome
            engine: chromium
          - project: mobile-safari
            engine: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ matrix.engine }}
          restore-keys: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.engine }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-directory
          path: dist/client/
      - run: pnpm exec playwright test --project=${{ matrix.project }}
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.project }}
          path: reports/artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # --- BENCHMARK - main / prod only ---
  benchmark:
    name: Benchmark Execution
    if: |
      (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'prod')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master' || github.base_ref == 'prod'))
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}-chromium
          restore-keys: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-directory
          path: dist/client/
      - run: pnpm exec playwright test --project=chromium --workers=1 --retries=0 --repeat-each=3 e2e/performance.spec.ts e2e/scene.spec.ts
        env:
          CI: true
          BENCHMARK: true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: reports/benchmark/
          retention-days: 30
          if-no-files-found: ignore

  # --- BENCHMARK REPORT - history lives in the Actions cache, so this works on a private repo ---
  benchmark-report:
    name: Benchmark Report
    needs: [benchmark]
    if: |
      (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'prod')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master' || github.base_ref == 'prod'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-results
          path: reports/benchmark/
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/benchmark
          key: benchmark-data-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: benchmark-data-${{ github.ref_name }}-
      - id: check-files
        run: |
          mkdir -p .cache/benchmark
          [ -f reports/benchmark/benchmark-smaller.json ] && echo "smaller=true" >> $GITHUB_OUTPUT || echo "smaller=false" >> $GITHUB_OUTPUT
          [ -f reports/benchmark/benchmark-bigger.json ] && echo "bigger=true" >> $GITHUB_OUTPUT || echo "bigger=false" >> $GITHUB_OUTPUT
      - if: steps.check-files.outputs.smaller == 'true'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: customSmallerIsBetter
          output-file-path: reports/benchmark/benchmark-smaller.json
          external-data-json-path: .cache/benchmark/data-smaller.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '130%'
          fail-threshold: '200%'
          comment-on-alert: true
          summary-always: true
      - if: steps.check-files.outputs.bigger == 'true'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: customBiggerIsBetter
          output-file-path: reports/benchmark/benchmark-bigger.json
          external-data-json-path: .cache/benchmark/data-bigger.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '130%'
          fail-threshold: '200%'
          comment-on-alert: true
          summary-always: true
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/benchmark
          key: benchmark-data-${{ github.ref_name }}-${{ github.run_id }}

  # --- DEPLOYMENT ---
  #
  # No host is prescribed. The three jobs below carry the gating logic and hand you a
  # dist/client/ to publish, the publishing step itself is yours to fill in.
  #
  # Keep the ordering: deploy runs BEFORE release, so no tag can point at code that was never
  # deployed. A deploy step exiting non-zero stops the matching release job, which is intended.
  #
  # deploy-preprod is wired to GitHub Pages (the Website-Demo at antoinepoisson.github.io) as a
  # worked example. GitHub Pages serves one live site per repo, so sandbox and prod stay empty:
  #
  #   Website-Demo   actions/deploy-pages           (wired below, on deploy-preprod)
  #   Netlify        netlify deploy --dir=dist/client --prod
  #   S3 / CDN       aws s3 sync dist/client s3://... --delete
  #   Your own box   rsync -az --delete dist/client/ user@host:/srv/...

  # --- DEPLOY SANDBOX - develop, always (even if tests fail) ---
  deploy-sandbox:
    name: Deploy Sandbox
    # always() on purpose, the sandbox is for iteration.
    if: always() && github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: [e2e-test, e2e-mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-directory
          path: dist/client/
      - name: Deploy
        run: |
          echo "::notice::No deployment provider configured, the site is in ./dist/client"
          ls -la dist/client
          # ▼ Your deployment command goes here. ▼

  # --- DEPLOY PREPROD - main, always. Release only if the deploy succeeded ---
  #
  # Wired to GitHub Pages: this is what serves antoinepoisson.github.io/React-Production-Starter/.
  # Requires Settings → Pages → Build and deployment → Source: "GitHub Actions" (a repo setting,
  # not something a workflow file can flip). Left on "Deploy from a branch" it renders README.md
  # instead, since the built dist/client/ is never committed.
  deploy-preprod:
    name: Deploy Preprod
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [e2e-test, e2e-mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-directory
          path: dist/client/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/client
      - name: Deploy to GitHub Pages
        id: deployment
        uses:
          actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
          # ▼ Your deployment command goes here. ▼

  release-preprod:
    name: Release Preprod
    if: needs.deploy-preprod.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [deploy-preprod]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config-preprod.json
          manifest-file: .release-please-manifest-preprod.json
          target-branch: main

  # --- DEPLOY PROD - prod, only if every test passed ---
  deploy-prod:
    name: Deploy Production
    # No `always()` here: a test failure blocks the deployment.
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    needs: [e2e-test, e2e-mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-directory
          path: dist/client/
      - name: Deploy
        run: |
          echo "::notice::No deployment provider configured, the site is in ./dist/client"
          ls -la dist/client
          # ▼ Your deployment command goes here. ▼

  release-prod:
    name: Release Production
    if: needs.deploy-prod.result == 'success' && github.ref == 'refs/heads/prod' && github.event_name == 'push'
    needs: [deploy-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config-prod.json
          manifest-file: .release-please-manifest-prod.json
          target-branch: prod
